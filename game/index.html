<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Harbour: Spot The Difference</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 16px 32px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .title-group h1 { margin: 0; font-size: 22px; font-weight: 700; color: #f8fafc; }
  .title-group span { font-size: 13px; color: #94a3b8; }
  .counter-box { font-size: 24px; font-weight: 800; color: #ffd214; letter-spacing: 0.5px; }
  .stats-group { display: flex; align-items: center; gap: 16px; }
  .timer-box { font-size: 16px; font-weight: 600; }
  .strikes-box { font-size: 13px; color: #94a3b8; }
  .btn { padding: 8px 18px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
  .btn-hint { background: #f59e0b; color: #111827; }
  .btn-pause { background: #374151; color: #f3f4f6; }
  .game-area { display: flex; gap: 24px; flex: 1; align-items: stretch; justify-content: center; }
  .pane-card { flex: 1; display: flex; flex-direction: column; max-width: 620px; }
  .pane-label { text-align: center; font-size: 13px; font-weight: 700; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .canvas-wrapper { position: relative; flex: 1; border: 3px solid #334155; border-radius: 8px; overflow: hidden; cursor: crosshair; }
  canvas { width: 100%; height: 100%; display: block; }
  .footer-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 0 4px; font-size: 14px; color: #94a3b8; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #334155; transition: background 0.2s; }
  .dot.found { background: #10b981; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title-group">
      <h1>The Harbour at Dawn</h1>
      <span>Scene 1 of 3 · Par 1:30</span>
    </div>
    <div class="counter-box" id="counter">4 to find</div>
    <div class="stats-group">
      <div>
        <div class="timer-box" id="timer">⏱ 0:42</div>
        <div class="strikes-box">Strikes: 0</div>
      </div>
      <button class="btn btn-hint" id="hint-btn">Hint (3)</button>
      <button class="btn btn-pause">Pause</button>
    </div>
  </header>
  <div class="game-area">
    <div class="pane-card">
      <div class="pane-label">LEFT — original</div>
      <div class="canvas-wrapper" id="wrap-left">
        <canvas id="cvs-left" width="580" height="510"></canvas>
      </div>
    </div>
    <div class="pane-card">
      <div class="pane-label">RIGHT — spot the changes</div>
      <div class="canvas-wrapper" id="wrap-right">
        <canvas id="cvs-right" width="580" height="510"></canvas>
      </div>
    </div>
  </div>
  <div class="footer-bar">
    <span>Found:</span>
    <div class="dots" id="dots-container"></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
